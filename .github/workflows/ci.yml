name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # No apt step: @julusian/midi (a native dev dependency used only by tools/) ships a linux-x64
      # prebuild, so it never needs ALSA headers here, and nothing CI runs loads it. Installing
      # libasound2-dev only made every run depend on the Ubuntu mirrors being reachable.
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck # framework-free core
      - run: npm run typecheck:app # React Native surface
      - run: npm test
      - run: npm run fallow # codebase intelligence: dead code, cycles, duplication
